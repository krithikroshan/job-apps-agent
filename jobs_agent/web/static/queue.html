<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/logo-mark.svg" type="image/svg+xml">
<title>Job Queue</title>
<link rel="stylesheet" href="/static/ds-styles.css">
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/queue.css">
</head>
<body>
{nav}

<div class="queue">
  <aside class="rail">
    <div class="stages" id="stages" role="tablist" aria-label="Application stage"></div>

    <section class="filters" aria-labelledby="filters-title">
      <div class="filters-head">
        <h2 class="rail-title" id="filters-title">Filters <span class="filters-on" id="filters-on"></span></h2>
        <button class="btn btn-ghost btn-sm" id="btn-clear-filters" type="button" hidden>Clear filters</button>
      </div>
      <div class="field">
        <label for="f-location">Location</label>
        <input class="input" id="f-location" type="text" list="f-location-options"
               placeholder="Anywhere">
        <datalist id="f-location-options"></datalist>
      </div>
      <div class="field-pair">
        <div class="field">
          <label for="f-min-salary">Salary from</label>
          <input class="input" id="f-min-salary" type="number" min="0" step="1000" placeholder="£">
        </div>
        <div class="field">
          <label for="f-max-salary">to</label>
          <input class="input" id="f-max-salary" type="number" min="0" step="1000" placeholder="£">
        </div>
      </div>
      <div class="field">
        <label for="f-contract-type">Job type</label>
        <select class="input" id="f-contract-type">
          <option value="">Any</option>
          <option value="permanent">Permanent</option>
          <option value="contract">Contract</option>
          <option value="temp">Temp</option>
        </select>
      </div>
      <div class="field-pair">
        <div class="field">
          <label for="f-min-score">Minimum match</label>
          <input class="input" id="f-min-score" type="number" value="0" min="0" step="1">
        </div>
        <div class="field">
          <label for="f-limit">Per page</label>
          <input class="input" id="f-limit" type="number" value="50" min="1" step="1">
        </div>
      </div>
    </section>

    <section class="filters" aria-labelledby="ai-filters-title">
      <h2 class="rail-title" id="ai-filters-title">From the AI's reading</h2>
      <div class="field">
        <label for="f-visa">Visa sponsorship</label>
        <select class="input" id="f-visa">
          <option value="">Any</option>
          <option value="offered">Says it sponsors visas</option>
          <option value="hide_not_offered">Hide "no sponsorship"</option>
        </select>
      </div>
      <div class="field-pair">
        <div class="field">
          <label for="f-level">Level</label>
          <select class="input" id="f-level">
            <option value="">Any</option>
            <option value="entry">Graduate or entry</option>
            <option value="junior">Up to junior</option>
          </select>
        </div>
        <div class="field">
          <label for="f-max-years">Max years asked</label>
          <input class="input" id="f-max-years" type="number" min="0" max="15" step="1" placeholder="Any">
        </div>
      </div>
      <label class="check"><input type="checkbox" id="f-graduate-scheme"> Graduate schemes only</label>
      <label class="check"><input type="checkbox" id="f-study-support"> Funds a qualification (ACA, ACCA…)</label>
      <label class="check"><input type="checkbox" id="f-hide-red-flags"> Hide postings with red flags</label>
    </section>

    <p class="rail-note">Nothing here sends an application. You submit each one yourself,
      after reading the letter.</p>
  </aside>

  <main class="queue-main">
    <div class="queue-head">
      <div class="queue-title">
        <h1 id="stage-title">Queue</h1>
        <p class="stage-count" id="stage-count"></p>
      </div>
      <div class="head-actions">
        <button class="btn btn-secondary" id="btn-refresh">Refresh</button>
        <button class="btn btn-primary" id="btn-fetch">Fetch new listings</button>
      </div>
    </div>

    <div class="analysis-bar" id="analysis-bar" hidden>
      <div class="analysis-text" id="analysis-text"></div>
      <div class="analysis-progress" id="analysis-progress" hidden><span></span></div>
      <button class="btn btn-secondary btn-sm" id="btn-analyse">Analyse with AI</button>
      <button class="btn btn-ghost btn-sm" id="btn-retry-analysis" hidden>Try those again</button>
    </div>

    <form class="search" id="search-form" role="search">
      <label class="visually-hidden" for="search-input">Describe what you're looking for</label>
      <input class="input" id="search-input" type="search" maxlength="300" autocomplete="off"
             placeholder="Describe what you want, e.g. graduate audit schemes in Manchester that sponsor visas">
      <button class="btn btn-secondary" type="submit" id="btn-search">Search</button>
    </form>
    <p class="search-note" id="search-note" hidden></p>

    <div class="banner" id="status-msg" role="status" aria-live="polite"></div>

    <div class="ledger">
      <div class="ledger-head" aria-hidden="true">
        <span>Match</span><span>Role</span><span>Location</span>
        <span class="num">Salary</span><span>Posted</span><span>Source</span><span></span>
      </div>
      <div id="results"><p class="empty-line">Loading…</p></div>
    </div>

    <nav class="pager" id="pager" aria-label="Pages" hidden>
      <button class="btn btn-secondary btn-sm" id="page-prev" type="button">Previous</button>
      <span class="pager-text" id="page-text" aria-live="polite"></span>
      <button class="btn btn-secondary btn-sm" id="page-next" type="button">Next</button>
    </nav>
  </main>
</div>

<script src="/static/nav.js"></script>
<script src="/static/queue.js"></script>
</body>
</html>
