<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Queue</title>
<link rel="stylesheet" href="/static/ds-styles.css">
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/queue.css">
</head>
<body>
{nav}

<div class="queue">
  <aside class="rail">
    <section>
      <h6>Stage</h6>
      <div class="stages" id="stages" role="tablist" aria-label="Application stage"></div>
    </section>

    <section class="filters">
      <div class="field">
        <label for="f-location">Location</label>
        <input class="input" id="f-location" type="text" list="f-location-options"
               placeholder="Anywhere">
        <datalist id="f-location-options"></datalist>
      </div>
      <div class="field">
        <label for="f-limit">Show at most</label>
        <input class="input" id="f-limit" type="number" value="50" min="1" step="1">
      </div>
      <div class="field">
        <label for="f-min-score">Minimum score</label>
        <input class="input" id="f-min-score" type="number" value="0" min="0" step="1">
      </div>
      <div class="field">
        <label for="f-min-salary">Compensation from</label>
        <input class="input" id="f-min-salary" type="number" min="0" step="1000" placeholder="£">
      </div>
      <div class="field">
        <label for="f-max-salary">Compensation to</label>
        <input class="input" id="f-max-salary" type="number" min="0" step="1000" placeholder="£">
      </div>
      <div class="field">
        <label for="f-contract-type">Job type</label>
        <select class="input" id="f-contract-type">
          <option value="">Any</option>
          <option value="permanent">Permanent</option>
          <option value="contract">Contract</option>
          <option value="temp">Temp</option>
        </select>
      </div>
    </section>

    <section class="rail-actions">
      <button class="btn btn-primary btn-block" id="btn-fetch">Fetch new listings</button>
      <button class="btn btn-secondary btn-block" id="btn-refresh">Refresh queue</button>
      <p class="rail-note">Reed and Adzuna. Nothing is ever submitted for you.</p>
    </section>
  </aside>

  <div class="queue-main">
    <div class="page-title">
      <h2 id="stage-title">Queue</h2>
      <span class="count" id="stage-count"></span>
    </div>

    <div class="banner" id="status-msg"></div>

    <main id="results"><p class="empty-line">Loading…</p></main>
  </div>
</div>

<script src="/static/nav.js"></script>
<script src="/static/queue.js"></script>
</body>
</html>
