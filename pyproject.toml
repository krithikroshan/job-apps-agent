[project]
name = "jobs-agent"
version = "0.1.0"
description = "Ranked review queue for UK job applications, with career-field presets."
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "cryptography>=40",
    "pypdf>=4.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jobs-agent = "jobs_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobs_agent*"]

[tool.setuptools.package-data]
jobs_agent = ["storage/*.sql", "web/static/*"]

[tool.vercel]
entrypoint = "jobs_agent.web:Handler"

[tool.pytest.ini_options]
testpaths = ["tests"]
